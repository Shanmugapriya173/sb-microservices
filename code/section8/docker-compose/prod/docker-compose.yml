services:
  configserver:
    image: devopsshan/configserver:s8
    container_name: configserver_ms
    ports:
      - 8071:8071
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: devopsshan/eurekaserver:s8
    container_name: eurekaserver_ms
    ports:
      - 8070:8070
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRINT_APPLICATION_NAME: "eurekaserver"

  accounts:
    image: devopsshan/accounts:s8
    container_name: accounts_ms
    ports:
      - 8080:8080
    #    environment:
    #      SPRING_APPLICATION_NAME: "accounts"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  loans:
    image: devopsshan/loans:s8
    container_name: loans_ms
    ports:
      - 8090:8090
    #    environment:
    #      SPRING_APPLICATION_NAME: "loans"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  cards:
    image: devopsshan/cards:s8
    container_name: cards_ms
    ports:
      - 9000:9000
    #    environment:
    #      SPRING_APPLICATION_NAME: "cards"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
networks:
  eazybank:
    driver: bridge
services:
  redis:
    image: redis
    container_name: redis_ms
    ports:
      - 6379:6379
    healthcheck:
#      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 10
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: devopsshan/configserver:s10
    container_name: configserver_ms
    ports:
      - 8071:8071
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: devopsshan/eurekaserver:s10
    container_name: eurekaserver_ms
    ports:
      - 8070:8070
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    depends_on:
      configserver:
        condition: service_healthy
#    environment:
#      SPRINT_APPLICATION_NAME: "eurekaserver"

  accounts:
    image: devopsshan/accounts:s10
    container_name: accounts_ms
    ports:
      - 8080:8080
#    environment:
#      SPRING_APPLICATION_NAME: "accounts"
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-eureka-config
  loans:
    image: devopsshan/loans:s10
    container_name: loans_ms
    ports:
      - 8090:8090
#    environment:
#      SPRING_APPLICATION_NAME: "loans"
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  cards:
    image: devopsshan/cards:s10
    container_name: cards_ms
    ports:
      - 9000:9000
#    environment:
#      SPRING_APPLICATION_NAME: "cards"
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  gatewayserver:
    image: devopsshan/gatewayserver:s10
    container_name: gatewayserver_ms
    ports:
      - 8072:8072
    depends_on:
      accounts:
        condition: service_healthy
      cards:
        condition: service_healthy
      loans:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: "redis"
    extends:
      file: common-config.yml
      service: microservice-eureka-config
networks:
  eazybank:
    driver: bridge